query {
    getAllEvents {
        id
        title
        description
        startDate
        endDate
        track {
            variantName
            distance
            lapRecord
            circuit {
                name
                website
                latitude
                longitude
            }
        }
        participants {
            member {
                firstName
                lastName
                email
            }
        }
        organizer {
            name
        }
        price
        createdOn
        createdBy {
            id
            firstName
            lastName
        }
        modifiedOn
        modifiedBy {
            id
            firstName
            lastName
        }
    }
}